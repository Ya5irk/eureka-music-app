services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eureka_music}
      POSTGRES_USER: ${POSTGRES_USER:-eureka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eureka}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eureka} -d ${POSTGRES_DB:-eureka_music}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-eureka}:${POSTGRES_PASSWORD:-eureka}@db:5432/${POSTGRES_DB:-eureka_music}
      STORAGE_DIR: /data/audio
    volumes:
      - audio_storage:/data/audio
    ports:
      - "8000:8000"

volumes:
  pgdata:
  audio_storage:
