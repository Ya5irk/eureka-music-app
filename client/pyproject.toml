[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Qt's own model-override idiom is `def rowCount(self, parent=QModelIndex())`
# — a fresh default index, not the mutable-default footgun B008 targets.
extend-immutable-calls = ["PySide2.QtCore.QModelIndex"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside2"
